name: Validate

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements_test.txt
      - run: ruff check .
      - name: Diagnose custom integration discovery
        run: python -c "import custom_components, pathlib, json; print('package:', custom_components.__file__, list(custom_components.__path__)); p=pathlib.Path(list(custom_components.__path__)[0])/'sensor_guardian'/'manifest.json'; print('manifest:', p, p.exists(), json.loads(p.read_text()) if p.exists() else None)"
      - run: pytest -q
